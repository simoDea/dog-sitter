<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Dashboard - DogBuddy</title>
    <style>
        :root {
            --sidebar-width: 260px;
            --topbar-height: 70px;
            --primary:rgb(212, 70, 146);
            --bg-dash: #f1f5f9;
        }

        body {
            margin: 0;
            display: flex;
            font-family: 'Inter', monospace;
            background-color: var(--bg-dash);
        }

        /* Sidebar sinistra */
        aside {
            width: var(--sidebar-width);
            height: 100vh;
            background: white;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
        }

        nav ul { list-style: none; padding: 0; margin-top: 40px; }
        nav li { padding: 15px; border-radius: 8px; cursor: pointer; color: black; margin-bottom: 5px; }
        nav li:hover { background: #f8fafc; color: black; }
        nav li.active { background: var(--primary); color: black; }

        /* Contenuto Principale */
        main {
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
            min-height: 100vh;
        }

        /* Barra superiore */
        .top-bar {
            height: var(--topbar-height);
            background: white;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid #e2e8f0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-name { font-weight: 600; font-size: 0.9rem; }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #cbd5e1; /* Segnaposto foto */
            object-fit: cover;
        }

        .content-area {
            padding: 40px;
        }

        .default-user-icon{
            width:40px;
            height:40px;
            border-radius:50%;
            background:#ddd;
            align-items:center;
            justify-content:center;
            font-size:18px;
        }           
    </style>
</head>
<body>

<aside>
    <div style="font-weight: 800; color: black; font-size: 1.2rem;">DogSitter Giulsu</div>
    <nav>
        <ul>
            <li class="active">Dashboard</li>
            <li>Home</li>
            <li>Prenotazioni</li>
            <li>Messaggi</li>
            <li>Impostazioni</li>
        </ul>
    </nav>
</aside>

<main>
    <div class="top-bar">
        <div class="user-profile">
            <span class="user-name">Mario Rossi</span>
            <img 
                src="https://via.placeholder.com/40"
                alt="Foto Profilo"
                class="user-avatar"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-flex';">

            <i class="fa-solid fa-user default-user-icon" style="display:none;"></i>
        </div> 
    </div>

    <div class="content-area">
        <!-- Spazio vuoto per i contenuti futuri -->
        <h2 style="color: #94a3b8;">Benvenuto nella tua area riservata.</h2>
    </div>
</main>

</body>
</html>
